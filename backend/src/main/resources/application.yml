logging:
  file:
    name: ./data/logs/diabcare.log
  console:
    enabled: true
  level:
    root: debug
    javax.management: error
    sun.rmi.loader: error
    sun.rmi.transport: error

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
