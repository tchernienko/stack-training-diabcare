spring:
  application:
    name: diabcare-api

  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/db/diabcare
    username: ${DB_USER:SA}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update # OK pour un projet d'apprentissage solo ; à remplacer par Flyway/Liquibase pour les migrations versionnées
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true

