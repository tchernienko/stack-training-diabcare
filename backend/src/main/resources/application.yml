spring:
  application:
    name: diabcare-api
  jmx:
    enabled: false

  datasource:
    url: jdbc:h2:mem:diabcare
    username: ${DB_USER:SA}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update # OK pour un projet d'apprentissage solo ; à remplacer par Flyway/Liquibase si un jour vous voulez pratiquer les migrations versionnées
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/diabcare}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: diabcare-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.diabcare.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  file:
    path: target/logs
    name: diabcare.log
  console:
    enabled: true
  level:
    root: debug
    javax.management: error
    sun.rmi.loader: error
    sun.rmi.transport: error

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
