spring:
  application:
    name: diabcare-api
  jmx:
    enabled: false

  datasource:
    url: jdbc:h2:file:./data/db/diabcare
    username: ${DB_USER:SA}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create # OK pour un projet d'apprentissage solo ; à remplacer par Flyway/Liquibase pour les migrations versionnées
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

